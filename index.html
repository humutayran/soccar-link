<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Soccar daveti</title>
  <meta name="description" content="Soccar maç ya da takım daveti. Uygulamada açmak için dokun.">
  <style>
    :root { color-scheme: dark; --bg: #0d0d0d; --surface: #1a1a1a; --border: #2d2d2d; --text: #fff; --muted: #9e9e9e; --accent: #c8ff00; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           display: flex; align-items: center; justify-content: center; padding: 16px; }
    main { width: 100%; max-width: 420px; display: grid; gap: 16px; }
    .eyebrow { color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 28px; line-height: 1.2; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; display: grid; gap: 8px; }
    .code { font-size: 36px; font-weight: 900; letter-spacing: .25em; }
    .muted { color: var(--muted); font-size: 14px; margin: 0; }
    .button { display: block; text-align: center; text-decoration: none; background: var(--accent); color: #0d0d0d;
              font-weight: 800; padding: 14px 16px; border-radius: 999px; }
    .error { color: #ef4444; }
    ol { margin: 0; padding-left: 20px; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <div>
      <div class="eyebrow">Soccar</div>
      <h1 id="title">Davet</h1>
    </div>

    <div class="card" id="codeCard" hidden>
      <p class="muted" id="codeLabel">Kod</p>
      <div class="code" id="code"></div>
    </div>

    <a class="button" id="open" href="#" hidden>Uygulamada aç</a>

    <div class="card" id="help" hidden>
      <p class="muted"><strong>Uygulama açılmadıysa:</strong></p>
      <ol>
        <li>Soccar yüklü değilse grubundan ya da maçı kurandan kurulum linkini iste.</li>
        <li id="manualStep">Uygulamada <em>Maçlar › Maç Kur › Maç kodun mu var?</em> kısmına yukarıdaki kodu yaz.</li>
      </ol>
    </div>

    <p class="muted error" id="invalid" hidden>Bu link eksik ya da bozuk. Daveti gönderen kişiden yeni link iste.</p>
  </main>

  <script>
    // Kod yalnızca karışmayan harf ve rakamlardan oluşur (I, L, O, U, 0, 1 yok).
    // Sayfaya yalnızca bu biçime uyan kod yazılır; başka hiçbir girdi kullanılmaz.
    (function () {
      var CODE = /^[2-9ABCDEFGHJKMNPQRSTVWXYZ]{5}$/;
      var params = new URLSearchParams(window.location.search);
      var match = (params.get('m') || '').trim().toUpperCase();
      var team = (params.get('t') || '').trim().toUpperCase();
      var kind = CODE.test(match) ? 'match' : CODE.test(team) ? 'team' : null;
      if (!kind) {
        document.getElementById('invalid').hidden = false;
        return;
      }
      var code = kind === 'match' ? match : team;
      var appLink = 'soccar://join/' + kind + '/' + code;

      document.title = kind === 'match' ? 'Soccar maç daveti' : 'Soccar takım daveti';
      document.getElementById('title').textContent =
        kind === 'match' ? 'Maça çağrıldın ⚽' : 'Takıma davet edildin';
      document.getElementById('codeLabel').textContent = kind === 'match' ? 'Maç kodu' : 'Takım etiketi';
      document.getElementById('code').textContent = code;
      document.getElementById('codeCard').hidden = false;
      if (kind === 'team') {
        document.getElementById('manualStep').textContent =
          'Link yine açılmazsa takımın kurucusundan ya da kaptanından seni uygulamadan doğrudan davet etmesini iste.';
      }
      var open = document.getElementById('open');
      open.href = appLink;
      open.hidden = false;
      document.getElementById('help').hidden = false;
    })();
  </script>
</body>
</html>
